<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="./CSS/styles_projektseite.css">
    <link rel="stylesheet" media="screen and (max-width: 768px)" href="./CSS/styles_mobile.css">
    <title>Portfolio Lara Müller</title>
</head>

<body class="landing">

  <header class="top-bar">
    <h1 class="left"><a href="00_Uebersicht_GD.html">Graphic Design</a>
    </h1>

     <h1 class="center"><a href="index.html">Portfolio<br>Lara Müller</a>
    </h1>
   

    <h1 class="right"><a href="00_Uebersicht_Fotografie.html">Photography</a></h1>
</header>



<section class="green-section">
  <div class="gallery" id="gallery"></div>
  <div class="scroll-arrow">▼</div>
</section>

<div class="background-text">
  Welcome<br>
  to my<br>
  Portfolio
</div>

<section class="dark-section">
  <div class="image-big">
    <img src="images/Projekte_Grafik/01_Typeonscreen/IMG_1678.webp" alt="Bild 3">
  </div>

  <div class="image-big">
    <img src="images/Projekte_Grafik/05_Suedpol/IMG_0603.jpg" alt="Bild 3">
  </div>

   <div class="image-big">
    <img src="images/Projekte_Fotografie/Bauer/IMG_9758.jpg" alt="Bild 3">
  </div>


  
</section>

<footer class="footer">
  <h1 class="left"><a href="https://www.instagram.com/atelier.lamue.graphicdesign/">Instagram</a></h1>
  <h1 class="right"><a href="Kontakt.html">Contact</a></h1>
</footer>

<script>
  window.addEventListener('scroll', function() {
    var text = document.querySelector('.background-text');
    var green = document.querySelector('.green-section');
    var arrow = document.querySelector('.scroll-arrow');
    if (!text || !green) return;
    var rect = green.getBoundingClientRect();
    var isPast = rect.bottom <= 0;

    text.style.color = isPast ? 'rgb(53, 255, 44)' : 'rgb(0, 0, 0)';

    var links = document.querySelectorAll('.top-bar a, .footer a');
    for (var i = 0; i < links.length; i++) {
      links[i].style.color = isPast ? 'rgb(255, 255, 255)' : 'rgb(0, 0, 0)';
    }

    if (arrow) {
      if (window.scrollY > 20) {
        arrow.classList.add('hidden');
      } else {
        arrow.classList.remove('hidden');
      }
    }
  });
</script>

</body>
</html>
